# Render Configuration
# Save as render.yaml in the project root

services:
  - type: web
    name: mad-backend
    plan: free
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DB_HOST
        value: your_mysql_host
      - key: DB_USER
        value: your_mysql_user
      - key: DB_PASSWORD
        value: your_mysql_password
        isSecret: true
      - key: DB_NAME
        value: mad_project_db
      - key: DB_PORT
        value: 3306
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: your_jwt_secret_key_here_make_it_long_and_strong
        isSecret: true
      - key: CLOUDINARY_CLOUD_NAME
        value: your_cloud_name
      - key: CLOUDINARY_API_KEY
        value: your_api_key
        isSecret: true
      - key: CLOUDINARY_API_SECRET
        value: your_api_secret
        isSecret: true
      - key: CORS_ORIGIN
        value: '*'
    healthCheckPath: /api/health
    healthCheckTimeout: 30
    healthCheckInterval: 30
