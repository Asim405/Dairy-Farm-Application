# Render Configuration
services:
  - type: web
    name: mad-backend
    plan: free
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DB_HOST
        value: your_mysql_host
      - key: DB_USER
        value: your_mysql_user
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: mad_project_db
      - key: DB_PORT
        value: '3306'
      - key: PORT
        value: '10000'
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: your_cloud_name
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: '*'
    healthCheckPath: /api/health